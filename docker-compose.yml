# AI 超市 · 一键部署（后端 FastAPI + 前端 Vue/nginx）
# 用法：
#   cp .env.example .env   # 按需填 DEEPSEEK_API_KEY / DOUYIN_* 等
#   docker compose up -d --build
#   访问 http://<服务器IP>:8080
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      # 容器内 sqlite 路径（生产改 MySQL：mysql+mysqlconnector://user:pwd@db:3306/ai_supermarket）
      - DATABASE_URL=sqlite:////app/ai_supermarket/web/backend/web_backend.db
    volumes:
      - backend_storage:/app/ai_supermarket/web/backend/storage
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_storage:
